name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS x64 release
    runs-on: macos-13
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
          python -m unittest discover -s tests
      - name: Build archive
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(uname -m)" = x86_64
          VERSION="${RELEASE_TAG#v}"
          REXARTICLES_VERSION="$VERSION" python -m PyInstaller --noconfirm --clean RexArticles.spec
          mkdir release
          ditto -c -k --sequesterRsrc --keepParent dist/RexArticles.app "release/RexArticles-macos-x64-v${VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*.zip
          if-no-files-found: error

  windows:
    name: Build Windows x64 release
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
          python -m unittest discover -s tests
      - name: Build installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          python -m PyInstaller --noconfirm --clean RexArticles.Windows.spec
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" RexArticles.iss
          if (!(Test-Path "release_windows\RexArticles-Setup-v$version.exe")) { throw "Windows installer was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release_windows/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
